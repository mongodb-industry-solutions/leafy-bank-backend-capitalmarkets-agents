---
kind: pipeline
type: kubernetes
name: staging

trigger:
  branch:
    - staging

steps:
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/capitalmarkets-sched-agents
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-backend-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: capitalmarkets-sched-agents
      values:
        - 'image.tag=git-${DRONE_COMMIT_SHA:0:7}'
        - 'image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/capitalmarkets-sched-agents'
        - 'ingress.enabled=true'
        - 'ingress.hosts[0]=capitalmarkets-sched-agents.industrysolutions.staging.corp.mongodb.com'
        - 'mesh.enabled=true'
        - 'resources.limits.cpu=300m'
        - 'resources.limits.memory=768Mi'
        - 'resources.requests.cpu=75m'
        - 'resources.requests.memory=384Mi'
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files: ['environments/staging.yaml']
    when:
      event:
        - push
---
kind: pipeline
type: kubernetes
name: prod

trigger:
  branch:
    - main

steps:
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/capitalmarkets-sched-agents-bian
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-backend-prod
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: capitalmarkets-sched-agents-bian-prod
      values:
        - 'image.tag=git-${DRONE_COMMIT_SHA:0:7}'
        - 'image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/capitalmarkets-sched-agents-bian'
        - 'ingress.enabled=true'
        - 'ingress.hosts[0]=capitalmarkets-sched-agents-bian.industrysolutions.prod.corp.mongodb.com'
        - 'mesh.enabled=true'
        - 'resources.limits.cpu=300m'
        - 'resources.limits.memory=768Mi'
        - 'resources.requests.cpu=75m'
        - 'resources.requests.memory=384Mi'
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
      values_files: ['environments/prod.yaml']
    when:
      event:
        - push
